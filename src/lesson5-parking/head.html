<title>停車場閘門實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EAF0EC;
  --surface:#FFFFFF;
  --surface-2:#F4F7F5;
  --ink:#14212A;
  --ink-2:#4E5E68;
  --ink-3:#83929B;
  --line:#D3DDD8;
  --accent:#D93A27;
  --accent-soft:#FBE3DE;
  --teal:#0B767A;
  --teal-soft:#DAEFEE;
  --amber:#B87808;
  --amber-soft:#FBEFD6;
  --ok:#1F8049;
  --ok-soft:#DDF2E5;
  --err:#C4301F;
  --err-soft:#FBE2DE;
  --mat:#1E5A4B;
  --shadow:0 1px 2px rgba(20,33,42,.06),0 6px 20px rgba(20,33,42,.07);
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
  --f-disp:"Chakra Petch","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1417;--surface:#152025;--surface-2:#1A272D;--ink:#E3EBEE;--ink-2:#A3B2B9;--ink-3:#6C7C84;--line:#29393F;
    --accent:#FF6B56;--accent-soft:#3B1C17;--teal:#43B8BA;--teal-soft:#123235;--amber:#E8AA3C;--amber-soft:#33280F;
    --ok:#4CC27F;--ok-soft:#133222;--err:#FF6E60;--err-soft:#3A1915;--mat:#173F36;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1417;--surface:#152025;--surface-2:#1A272D;--ink:#E3EBEE;--ink-2:#A3B2B9;--ink-3:#6C7C84;--line:#29393F;
  --accent:#FF6B56;--accent-soft:#3B1C17;--teal:#43B8BA;--teal-soft:#123235;--amber:#E8AA3C;--amber-soft:#33280F;
  --ok:#4CC27F;--ok-soft:#133222;--err:#FF6E60;--err-soft:#3A1915;--mat:#173F36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
code,.mono{font-family:var(--f-mono)}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-weight:900;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--ink-3);font-size:13px;white-space:nowrap}
.brand-lamp{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c8ffd6,#2FBF5C 55%,#13652E);box-shadow:0 0 0 3px var(--ok-soft)}
.stepper{display:flex;gap:4px;margin-inline:auto;flex-wrap:wrap}
.stepper button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px 6px 6px;border-radius:999px;color:var(--ink-3);font-size:14px}
.stepper button i{font-style:normal;font-family:var(--f-disp);font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:13px}
.stepper button.done{color:var(--ok)}
.stepper button.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper button.current{color:var(--ink);background:var(--surface-2);font-weight:700}
.stepper button.current i{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.stepper button:disabled{cursor:not-allowed;opacity:.55}
.who{font-size:13px;color:var(--ink-2);white-space:nowrap;padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.who:empty{display:none}
.early-btn{white-space:nowrap;border-color:var(--amber);color:var(--ink)}
.early-btn:hover{background:var(--amber-soft)}
.early-btn[hidden]{display:none}

main{padding-inline:20px;padding-block:22px 40px;max-width:1500px;margin-inline:auto}
.stage{display:block}
footer.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:20px;padding-block:14px 24px;color:var(--ink-3);font-size:12px;max-width:1500px;margin-inline:auto}
.linkbtn{border:0;background:none;color:var(--ink-3);text-decoration:underline;padding:0;font-size:12px}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;line-height:1.2;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
kbd{font-family:var(--f-mono);font-size:12px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface-2)}
.path{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;white-space:nowrap}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start}
.alert svg{margin-top:3px}
.alert.err{background:var(--err-soft);color:var(--ink)}
.alert.err svg{color:var(--err)}
.alert.ok{background:var(--ok-soft)}
.alert.ok svg{color:var(--ok)}
.alert.warn{background:var(--amber-soft)}
.alert.warn svg{color:var(--amber)}
.alert.info{background:var(--teal-soft)}
.alert.info svg{color:var(--teal)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- modal / toast / tip ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,18,22,.5);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:24px}
.modal.wide{max-width:980px}
.modal h3{font-size:20px;margin-bottom:10px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);animation:fade .2s}
.toast.err{background:var(--err);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
#tip{position:fixed;z-index:90;pointer-events:none;background:#101a1f;color:#fff;font-size:13px;padding:5px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#tip b{font-family:var(--f-mono);color:#ffd27a}

/* ---------- login ---------- */
.login-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:stretch;max-width:1080px;margin:10px auto 0}
.login-hero{background:#0F1B20;color:#E9F0F1;border-radius:16px;padding:36px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden}
.login-hero h1{font-size:44px;font-weight:900;letter-spacing:.02em}
.login-hero h1 small{display:block;font-family:var(--f-disp);font-size:15px;letter-spacing:.3em;color:#7FA7AC;font-weight:600;margin-bottom:6px}
.login-hero p{color:#A9BEC2;max-width:34em}
.lamp-row{display:flex;align-items:center;gap:26px;margin-top:8px}
.lamp{width:96px;height:96px;border-radius:50%;flex:none;background:radial-gradient(circle at 42% 38%,#5a2a25,#2a1412 70%);border:6px solid #2B3B40;box-shadow:inset 0 -6px 12px rgba(0,0,0,.4);transition:background .05s,box-shadow .05s}
.lamp.on{background:radial-gradient(circle at 42% 38%,#fff3ef,#ff7a62 40%,#e0331c 75%);box-shadow:0 0 30px 10px rgba(255,90,60,.55),0 0 90px 20px rgba(255,80,50,.25)}
.morse{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.morse .letter{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.morse .letter b{font-family:var(--f-disp);font-size:20px;margin-right:6px;color:#fff}
.morse .sym{height:12px;border-radius:6px;background:#3a4c52;transition:background .05s}
.morse .sym.dot{width:12px}
.morse .sym.dash{width:36px}
.morse .sym.lit{background:#ff6a50;box-shadow:0 0 10px rgba(255,106,80,.7)}
.login-card{display:flex;flex-direction:column;gap:14px;padding:28px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:14px}
.field input{border:1.5px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:16px}
.field input:focus{border-color:var(--teal);outline:none;background:var(--surface)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-err{color:var(--err);font-size:13px;min-height:1.2em}

/* ---------- intro ---------- */
.intro-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;max-width:1180px;margin:0 auto}
.intro-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.intro-head h2{font-size:32px;font-weight:900}
.intro-head p{max-width:46em;color:var(--ink-2);margin-top:6px}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-8{grid-column:span 8}.span-12{grid-column:1/-1}.span-6{grid-column:span 6}
.card h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.timing{width:100%;border-collapse:collapse;font-size:14px}
.timing td,.timing th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.timing th{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.timing td.num{font-family:var(--f-mono);white-space:nowrap}
.tl{position:relative;height:46px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:14px}
.tl .seg{position:absolute;top:10px;height:18px;border-radius:4px;background:var(--accent)}
.tl .lab{position:absolute;bottom:2px;font-size:10px;color:var(--ink-3);font-family:var(--f-mono);transform:translateX(-50%)}
.tl .head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.7}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.part{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--surface-2)}
.part svg{height:52px;width:auto}
.part b{font-size:14px}
.part span{font-size:12px;color:var(--ink-3)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:f}
.flow li{list-style:none;border-top:3px solid var(--ink);padding-top:8px}
.flow li b{display:block;font-size:15px}
.flow li span{font-size:13px;color:var(--ink-2)}
.flow{padding:0;margin:0}
.goals{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.fact{font-size:14px;color:var(--ink-2);border-left:3px solid var(--accent);padding-left:12px}

/* ---------- hardware ---------- */
.hw-layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:20px;font-weight:900}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps > li{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface-2)}
.steps > li .sh{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.steps > li .sh i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:12px;border:1.5px solid var(--ink-3);color:var(--ink-3)}
.steps > li.done{background:var(--ok-soft);border-color:transparent}
.steps > li.done .sh i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps > li.cur{background:var(--surface);border-color:var(--ink);box-shadow:var(--shadow)}
.steps > li.cur .sh i{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.steps > li.locked{opacity:.55}
.steps .sb{margin-top:8px;font-size:14px;display:flex;flex-direction:column;gap:9px}
.steps .sb p{color:var(--ink-2)}
.steps .sb p b{color:var(--ink)}
.issues{display:flex;flex-direction:column;gap:8px}
.statline{display:flex;gap:8px;flex-wrap:wrap}
.know{font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.know b{color:var(--ink)}
.ws{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.ws-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;min-height:50px}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.sel{box-shadow:0 0 0 2px var(--ink)}
.sel-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.sel-tools .lbl{color:var(--ink-2)}
#hwSvg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--mat)}
.ws-foot{padding:6px 12px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
@keyframes pulse{0%{r:8;opacity:.9}100%{r:17;opacity:0}}
.pulse{fill:none;stroke:#FFD34D;stroke-width:3;animation:pulse 1.1s ease-out infinite}
.target-dot{fill:#FFD34D}
@keyframes flow{to{stroke-dashoffset:-24}}
.flowline{fill:none;stroke:#FFE680;stroke-width:3;stroke-dasharray:6 6;animation:flow .6s linear infinite;pointer-events:none}
@media (prefers-reduced-motion: reduce){.pulse,.flowline{animation:none}}

/* ---------- IDE ---------- */
.code-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.ide{--ide-bg:#FFFFFF;--ide-chrome:#ECF1F1;--ide-bar:#006468;--ide-ink:#1F2B2C;--ide-line:#DAE3E3;
  background:var(--ide-bg);color:var(--ide-ink);border-radius:10px;overflow:hidden;border:1px solid #9FB3B4;box-shadow:var(--shadow);font-size:13px;display:flex;flex-direction:column;color-scheme:light}
.ide-menubar{display:flex;align-items:center;gap:2px;background:#F3F6F6;border-bottom:1px solid var(--ide-line);padding:2px 6px;position:relative;z-index:6}
.ide-menubar .title{margin-left:auto;color:#6C7A7B;font-size:12px;padding-right:6px}
.mbtn{border:0;background:none;padding:4px 9px;border-radius:4px;font-size:13px;color:#1F2B2C}
.mbtn:hover,.mbtn.open{background:#DCE6E6}
.menu{position:absolute;min-width:250px;background:#fff;border:1px solid #C4D0D0;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px 0;z-index:20;font-size:13px;color:#1F2B2C}
.menu .mi{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:5px 14px 5px 26px;white-space:nowrap;cursor:default;position:relative}
.menu .mi.act{cursor:pointer}
.menu .mi.act:hover,.menu .mi.hover{background:#008184;color:#fff}
.menu .mi.dis{color:#A0AAAB}
.menu .mi .sc{color:#8A9798;font-size:12px}
.menu .mi.act:hover .sc{color:#E0F2F2}
.menu .mi.checked::before{content:"✓";position:absolute;left:9px}
.menu .sep{height:1px;background:#E1E8E8;margin:4px 0}
.menu .hdr{padding:4px 14px 2px 26px;font-size:11px;color:#8A9798;text-transform:uppercase;letter-spacing:.05em}
.menu .mi .arrow{font-size:10px}
.ide-toolbar{display:flex;align-items:center;gap:8px;background:var(--ide-bar);padding:8px 10px}
.tb{width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:#006468;display:grid;place-items:center;flex:none}
.tb:hover{background:#E1F5F5}
.tb:disabled{opacity:.5}
.tb svg{width:18px;height:18px}
.tb.busy{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boardsel{position:relative;margin-left:6px}
.boardsel > button{display:flex;align-items:center;gap:8px;background:#fff;border:0;border-radius:4px;padding:6px 10px;min-width:230px;font-size:13px;color:#1F2B2C}
.boardsel > button .dot{width:8px;height:8px;border-radius:50%;background:#B7C3C4}
.boardsel > button .dot.on{background:#1DB954}
.boardsel > button span{flex:1;text-align:left}
.ide-toolbar .right{margin-left:auto;display:flex;gap:6px}
.ide-body{display:flex;min-height:0}
.ide-side{width:44px;background:var(--ide-chrome);border-right:1px solid var(--ide-line);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;color:#6A7B7C;flex:none}
.ide-side svg{width:20px;height:20px}
.ide-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ide-tabs{display:flex;background:var(--ide-chrome);border-bottom:1px solid var(--ide-line)}
.ide-tab{padding:7px 16px;background:#fff;border-right:1px solid var(--ide-line);font-size:13px;border-top:2px solid #008184}
.editor{height:470px;overflow:auto;font-family:var(--f-mono);font-size:13.5px;line-height:22px;background:#fff;position:relative}
.cl{display:flex;white-space:pre}
.cl .ln{width:46px;flex:none;text-align:right;padding-right:14px;color:#A6B2B3;user-select:none}
.cl .tx{flex:1;padding-right:20px}
.cl.cur{background:#F3F9F9}
.cl.cur .ln{color:#1F2B2C}
.cl.errline{background:#FFF0EE}
.k-type{color:#00979C}
.k-fn{color:#D35400}
.k-const{color:#00979C}
.k-struct{color:#728E00}
.k-com{color:#95A5A6}
.k-num{color:#005C5F}
.k-str{color:#A0522D}
.blank{font:inherit;font-family:var(--f-mono);font-size:13.5px;height:20px;border:0;border-bottom:2px dashed #E08A00;background:#FFF5DB;color:#1F2B2C;padding:0 3px;border-radius:3px 3px 0 0;text-align:center;vertical-align:baseline;outline:none}
.blank:focus{background:#FFE9AE;border-bottom-style:solid}
.blank.ok{border-bottom:2px solid #1F8049;background:#E3F5EA;color:#155C34}
.blank.bad{border-bottom:2px solid #C4301F;background:#FDE6E2}
.blank.rev{border-bottom:2px solid #9A6A00;background:#F4EBD5;color:#6A4A00}
.blank[readonly]{cursor:default}
