<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中二 DT Arduino 單元</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EAF0EC;--surface:#FFFFFF;--surface-2:#F4F7F5;--ink:#14212A;--ink-2:#4E5E68;--ink-3:#83929B;--line:#D3DDD8;
  --accent:#D93A27;--teal:#0B767A;--teal-soft:#DAEFEE;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-disp:"Chakra Petch","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--bg:#0D1417;--surface:#152025;--surface-2:#1A272D;--ink:#E3EBEE;--ink-2:#A3B2B9;--ink-3:#6C7C84;--line:#29393F;--accent:#FF6B56;--teal:#43B8BA;--teal-soft:#123235}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:32px 48px}
.hero{background:#0F1B20;color:#E9F0F1;border-radius:16px;padding:32px 36px;display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap}
.hero small{display:block;font-family:var(--f-disp);font-size:14px;letter-spacing:.3em;color:#7FA7AC;margin-bottom:6px}
.hero h1{margin:0;font-size:38px;font-weight:900;line-height:1.2;text-wrap:balance}
.hero p{margin:10px 0 0;color:#A9BEC2;max-width:36em}
.board{flex:none;width:170px;height:auto}
h2{font-size:14px;letter-spacing:.12em;color:var(--ink-3);margin:32px 0 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lesson{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;color:inherit;text-decoration:none;min-height:112px}
a.lesson{transition:border-color .15s,transform .15s,box-shadow .15s}
a.lesson:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,118,122,.14)}
a.lesson:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-family:var(--f-disp);font-weight:700;font-size:40px;line-height:1;text-align:center;color:var(--teal);border-right:1px solid var(--line);padding-right:12px}
.lesson.soon{background:var(--surface-2);border-style:dashed}
.lesson.soon .num{color:var(--ink-3)}
.lesson h3{margin:0;font-size:18px;font-weight:900}
.lesson p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.lesson.soon .tag{background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink-3)}
@media (max-width:520px){.wrap{padding-inline:16px}.hero{padding:24px}.hero h1{font-size:30px}.board{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <small>F2 · DESIGN &amp; TECHNOLOGY</small>
      <h1>中二 DT · Arduino UNO 單元</h1>
      <p>五堂實作課。每一堂先在電腦上模擬接線和編程，再在真的 Arduino UNO 上完成，最後下載成績報告交給老師。</p>
    </div>
    <svg class="board" viewBox="0 0 170 120" aria-hidden="true">
      <rect x="10" y="8" width="150" height="104" rx="8" fill="#0E7C9B"/>
      <rect x="0" y="22" width="30" height="26" rx="2" fill="#C9D0D3"/>
      <rect x="54" y="14" width="96" height="8" fill="#1A1A1A"/>
      <rect x="70" y="98" width="80" height="8" fill="#1A1A1A"/>
      <rect x="76" y="66" width="68" height="16" rx="2" fill="#1E1E1E"/>
      <text x="112" y="56" font-size="17" fill="#fff" font-style="italic" font-weight="700" text-anchor="middle" font-family="Chakra Petch, sans-serif">UNO</text>
      <circle cx="42" cy="84" r="9" fill="#FF5B45"/><circle cx="42" cy="84" r="16" fill="#FF5B45" opacity=".25"/>
    </svg>
  </header>

  <h2>課堂項目</h2>
  <div class="grid" id="lessons"></div>
  <p class="foot">學生進度只儲存在所用的電腦及瀏覽器內。</p>
</div>
<script>
/* 新增或更新一堂：修改這個清單即可（href 留空 = 準備中） */
const LESSONS = [
  { n: 1, title: 'Arduino 初體驗：閃動 L 燈', desc: '認識 UNO 板、麵包板相通孔、setup 和 loop、pinMode / digitalWrite / delay；第一次選板上傳。延伸挑戰：心跳燈、修好壞掉的程式', href: 'lesson1/' },
  { n: 2, title: 'SOS 求救燈', desc: 'LED、電阻、digitalWrite 和 delay；用摩斯密碼閃出 SOS。延伸挑戰：蜂鳴器聲光 SOS、閃出英文縮寫', href: 'lesson2/' },
  { n: 3, title: '行人過路燈', desc: '按鈕、下拉電阻、digitalRead 和 if / else；按掣後按香港次序轉燈。延伸挑戰：過路嘀嘀聲、單車防盜警報', href: 'lesson3/' },
  { n: 4, title: '第 4 堂', desc: '內容準備中', href: '' },
  { n: 5, title: '第 5 堂', desc: '內容準備中', href: '' },
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
document.getElementById('lessons').innerHTML = LESSONS.map(l => {
  const inner = `<div class="num">${l.n}</div><div><h3>${esc(l.title)}</h3><p>${esc(l.desc)}</p><span class="tag">${l.href ? '進入項目' : '準備中'}</span></div>`;
  return l.href ? `<a class="lesson" href="${esc(l.href)}">${inner}</a>` : `<div class="lesson soon" aria-disabled="true">${inner}</div>`;
}).join('');
</script>
</body>
</html>
